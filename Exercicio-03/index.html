<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #87a3be;
            color: #333;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .calculadora {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .calculadora h1 {
            color: #172554;
            text-align: center;
            margin-bottom: 10px;
        }

        .calculadora > p {
            text-align: center;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            color: #172554;
            margin-bottom: 6px;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
        }

        .campo input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #172554;
        }

        .resultado {
            margin-top: 25px;
            padding: 20px;
            background-color: #f1f5f9;
            border-radius: 8px;
            border: 2px solid #2563eb;
            text-align: center;
        }

        .resultado h2 {
            color: #172554;
            margin-bottom: 10px;
        }

        .resultado p {
            font-size: 18px;
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="calculadora">

            <h1>Calculadora de Média</h1>

            <p>
                Digite as notas do aluno para calcular a média.
            </p>

            <form>

                <div class="campo">
                    <label for="nota1">Nota 1:</label>
                    <input type="number" id="nota1" min="0" max="10" step="0.1" required>
                </div>

                <div class="campo">
                    <label for="nota2">Nota 2:</label>
                    <input type="number" id="nota2" min="0" max="10" step="0.1" required>
                </div>

                <div class="campo">
                    <label for="nota3">Nota 3:</label>
                    <input type="number" id="nota3" min="0" max="10" step="0.1" required>
                </div>

                <button type="button" onclick="calcularMedia()">
                    Calcular Média
                </button>

                <button type="reset" onclick="limparResultado()">
                    Limpar
                </button>

            </form>

            <p class="resultado" id="media"></p>
            <p class="resultado" id="situacao"></p>

        </section>

    </main>

    <script>
        function calcularMedia() {

            let nota1 = Number(document.getElementById("nota1").value);
            let nota2 = Number(document.getElementById("nota2").value);
            let nota3 = Number(document.getElementById("nota3").value);

            let media = (nota1 + nota2 + nota3) / 3;

            document.getElementById("media").textContent =
                "Média: " + media.toFixed(2);

            let situacao;

            if (media >= 7) {
                situacao = "Aprovado";
            } else if (media >= 5) {
                situacao = "Recuperação";
            } else {
                situacao = "Reprovado";
            }

            document.getElementById("situacao").textContent =
                "Situação: " + situacao;
        }

        function limparResultado() {

            document.getElementById("media").textContent = "";
            document.getElementById("situacao").textContent = "";

        }
    </script>

</body>

</html>
